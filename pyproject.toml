[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dinbrief"
version = "0.3.0"
description = "Text-first DIN 5008 letter generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "markdown-it-py>=3.0",
  "platformdirs>=4.3",
  "pydantic>=2.10",
  "python-frontmatter>=1.1",
  "PyYAML>=6.0",
  "rich>=13.9",
  "typer>=0.15",
  "typst>=0.14.8",
  "watchfiles>=1.0",
]

[project.optional-dependencies]
search = [
  "lancedb>=0.34,<0.35",
]
dev = [
  "bandit>=1.8",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
dinbrief = "dinbrief.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dinbrief"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "dinbrief/resources/schemas"
".vscode" = "dinbrief/resources/vscode"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dinbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
